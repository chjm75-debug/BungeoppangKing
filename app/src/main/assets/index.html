<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>붕어빵 장사왕</title>
<style>
:root{--bg:#201713;--wood:#70472f;--wood2:#4b2d20;--cream:#fff0d4;--line:#6b4a37;--gold:#f3b64f;--red:#b64d38;--green:#4f8746;--glass:#bfe7f322;--muted:#d9c4ae}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:linear-gradient(#263848 0 22%,#1f1a17 22% 100%);color:#fff;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
button{font:inherit;color:inherit}
#app{max-width:760px;margin:auto;padding:8px 8px 76px}
.header{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:center;background:#2f211a;border:1px solid var(--line);border-radius:15px;padding:9px 10px;position:sticky;top:0;z-index:10;box-shadow:0 8px 20px #0005}
.brand{font-weight:900;font-size:18px}.mini{font-size:12px;color:#f4d79f}.stat{background:#4a3327;border-radius:10px;padding:7px 9px;font-weight:900;font-size:13px;white-space:nowrap}
.stall{margin-top:8px;border:2px solid #372016;border-radius:18px;overflow:hidden;background:#5e3827;box-shadow:0 10px 30px #0005}
.awning{height:28px;background:repeating-linear-gradient(90deg,#bd4a36 0 42px,#f0d8ad 42px 84px);border-bottom:3px solid #372016}
.customerStrip{background:linear-gradient(180deg,#f4e3c5,#e8cfa9);color:#43291d;padding:8px;border-bottom:2px solid #7e5b43;min-height:82px}
.customerTitle{font-size:12px;font-weight:900;color:#7a5138;margin-bottom:5px}.customers{display:flex;gap:7px;overflow-x:auto}.customer{min-width:215px;background:#fff7e8;border:1px solid #c9a87a;border-radius:12px;padding:7px;display:grid;grid-template-columns:34px 1fr auto;gap:6px;align-items:center;box-shadow:0 3px 8px #0002}.avatar{font-size:25px}.order{font-size:12px;font-weight:900}.patience{height:5px;background:#d6c09a;border-radius:20px;overflow:hidden;margin-top:4px}.patience div{height:100%;background:#62a74f}.sell{border:0;background:#5a914a;border-radius:9px;padding:7px;font-weight:900;font-size:12px}
.workbench{padding:9px;background:linear-gradient(180deg,#805237,#63402d);position:relative}.benchTitle{text-align:center;font-size:12px;font-weight:900;color:#ffe3a5;margin-bottom:6px}.stationRow{display:grid;grid-template-columns:.78fr 1.55fr .9fr;gap:7px;align-items:stretch}
.station{background:linear-gradient(180deg,#3b2a22,#2c1f1a);border:1px solid #6f5140;border-radius:13px;padding:7px;min-width:0}.station h3{font-size:12px;margin:0 0 5px;color:#ffe4ae;text-align:center}.smallNote{font-size:10px;color:#cdb8a4;line-height:1.25;text-align:center}
.doughBowl{height:92px;display:flex;align-items:center;justify-content:center;position:relative}.bowl{width:95px;height:55px;border-radius:0 0 50px 50px;background:linear-gradient(#aaa 0 12%,#f1ede6 13% 30%,#e1bc78 31% 100%);border:2px solid #8b837a;position:relative;overflow:hidden}.bowl:after{content:"";position:absolute;left:6px;right:6px;top:12px;height:28px;border-radius:50%;background:radial-gradient(circle,#f5deb0,#e4bd78)}
.doughStatus{font-size:11px;text-align:center;margin:3px 0 5px;min-height:28px}.doughBtn,.shapeBtn,.openBtn,.endBtn,.manageBtn{width:100%;border:0;border-radius:10px;padding:8px 6px;font-weight:900;font-size:11px}.doughBtn{background:linear-gradient(#ef9453,#c25f38)}.shapeBtn{background:#836241}.openBtn{background:#4f8746}.endBtn{background:#7a3935}.manageBtn{background:#5a6472}.doughBtn:disabled,.shapeBtn:disabled,.openBtn:disabled,.endBtn:disabled{opacity:.4}
.progress{height:6px;background:#14100e;border-radius:10px;overflow:hidden;margin:4px 0}.progress div{height:100%;background:linear-gradient(90deg,#f1c45f,#e2743f);width:0}
.fillings{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:5px}.fill{border:0;border-radius:8px;background:#594136;padding:5px 6px;font-size:10px;font-weight:900}.fill.active{outline:2px solid #ffc85e}.fill:disabled{opacity:.35}
.grill{position:relative;background:linear-gradient(#2f2c29,#151413);border:5px solid #57514b;border-radius:15px;padding:7px;box-shadow:inset 0 0 25px #000}.grill:before,.grill:after{content:"";position:absolute;top:50%;width:24px;height:9px;border-radius:10px;background:#6b432e}.grill:before{left:-18px}.grill:after{right:-18px}.molds{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}.mold{position:relative;aspect-ratio:1.05/1;border-radius:12px;border:1px solid #706c67;background:radial-gradient(circle,#45413d,#22201e 65%);overflow:hidden}.mold:before{content:"";position:absolute;inset:7px;background:#282522;clip-path:polygon(7% 48%,15% 34%,29% 24%,44% 20%,58% 23%,69% 31%,78% 24%,91% 20%,83% 34%,95% 50%,83% 66%,90% 79%,77% 72%,67% 80%,55% 85%,41% 83%,26% 75%,13% 63%)}.fish{display:none;position:absolute;inset:8px;z-index:2;clip-path:polygon(7% 48%,15% 34%,29% 24%,44% 20%,58% 23%,69% 31%,78% 24%,91% 20%,83% 34%,95% 50%,83% 66%,90% 79%,77% 72%,67% 80%,55% 85%,41% 83%,26% 75%,13% 63%);background:linear-gradient(#efcf83,#cc7c35 55%,#94441d);box-shadow:inset 0 -8px 10px #74330d55}.fish:before{content:"";position:absolute;inset:14% 20%;background:repeating-radial-gradient(circle at 7px 7px,#0000 0 6px,#7a5227 7px 8px,#0000 9px 14px);opacity:.22}.fish:after{content:"";position:absolute;width:7px;height:7px;background:#2b1d16;border-radius:50%;left:65%;top:31%}.mold.batter .fish,.mold.cook1 .fish,.mold.flipReady .fish,.mold.cook2 .fish,.mold.outReady .fish,.mold.burnt .fish{display:block}.mold.batter .fish{background:linear-gradient(#f7dfb1,#e8c68b)}.mold.cook1 .fish{background:linear-gradient(#efca82,#d49148 60%,#b7672a)}.mold.cook2 .fish{background:linear-gradient(#e9c178,#c67631 58%,#8f3f1a)}.mold.burnt .fish{background:linear-gradient(#60402e,#2b1812 60%,#110b08)}.mold.flipReady,.mold.outReady{box-shadow:inset 0 0 0 3px #ffd367;animation:pulse .9s infinite}@keyframes pulse{50%{filter:brightness(1.2)}}.moldLabel{position:absolute;bottom:3px;left:2px;right:2px;z-index:3;font-size:8px;font-weight:900;text-align:center;text-shadow:0 1px #000}
.case{height:125px;border:2px solid #b7d5df;border-radius:12px;background:linear-gradient(135deg,var(--glass),#fff1 50%,#0002);padding:6px;position:relative;overflow:hidden}.case:before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#fff0 25%,#fff3 35%,#fff0 45%);pointer-events:none}.steam{position:absolute;top:10px;left:0;right:0;height:30px;pointer-events:none}.steam i{position:absolute;width:14px;height:28px;border-radius:50%;background:linear-gradient(#fff5,#fff0);filter:blur(5px);animation:steam 2.5s infinite}.steam i:nth-child(1){left:20%}.steam i:nth-child(2){left:52%;animation-delay:.7s}.steam i:nth-child(3){left:75%;animation-delay:1.3s}@keyframes steam{0%{transform:translateY(12px);opacity:0}50%{opacity:.4}100%{transform:translateY(-18px);opacity:0}}.shelf{display:flex;flex-wrap:wrap;gap:4px;position:relative;z-index:1}.item{width:43px;height:27px;border-radius:8px;background:linear-gradient(#efc97d,#af6329);border:1px solid #9a6238;position:relative}.item:before{content:"";position:absolute;inset:3px;background:#7b4f2825;clip-path:polygon(7% 48%,15% 34%,29% 24%,44% 20%,58% 23%,69% 31%,78% 24%,91% 20%,83% 34%,95% 50%,83% 66%,90% 79%,77% 72%,67% 80%,55% 85%,41% 83%,26% 75%,13% 63%)}.item span{position:absolute;right:-3px;top:-5px;background:#221713;border-radius:8px;font-size:8px;padding:1px 3px}.caseCount{text-align:center;font-size:10px;margin-top:4px;color:#e7d0bb}
.actionRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:7px}.actionRow button{font-size:11px}
.bottomBar{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:min(744px,calc(100% - 16px));display:grid;grid-template-columns:1fr 1fr;gap:7px;z-index:15;background:#241914e8;border:1px solid #624638;padding:7px;border-radius:14px;backdrop-filter:blur(8px)}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:30}.modal.show{display:flex}.modalCard{width:min(520px,100%);max-height:90vh;overflow:auto;background:#30231d;border:1px solid #765441;border-radius:16px;padding:14px;box-shadow:0 20px 50px #000}.modalCard h2{margin:0 0 10px;font-size:18px}.mixScene{text-align:center}.bigBowl{width:220px;height:125px;margin:10px auto;border-radius:0 0 110px 110px;background:linear-gradient(#aaa 0 15%,#eee 16% 30%,#e3c183 31%);border:3px solid #888;position:relative;overflow:hidden}.bigBowl:after{content:"";position:absolute;left:12px;right:12px;top:33px;height:65px;border-radius:50%;background:radial-gradient(circle,#fae6bb,#ebc982)}.whisk{position:absolute;z-index:2;left:105px;top:7px;width:18px;height:95px;background:#8b5b39;border-radius:9px;transform-origin:50% 85%;animation:whisk .5s infinite alternate}.whisk:after{content:"";position:absolute;top:62px;left:-20px;width:52px;height:45px;border:3px solid #ddd;border-top:0;border-radius:0 0 30px 30px}.whisk:before{content:"";position:absolute;top:61px;left:-10px;width:32px;height:42px;border:2px solid #ccc;border-top:0;border-radius:0 0 24px 24px}@keyframes whisk{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}.dots{display:flex;justify-content:center;gap:6px;margin:8px}.dots span{width:9px;height:9px;border-radius:50%;background:#715949;opacity:.3}.dots span.on{opacity:1;background:#ffd061}.full{width:100%}.manageGrid{display:grid;gap:8px}.upgrade{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#3d2d25;border:1px solid #60473a;border-radius:11px;padding:8px}.upgrade small{display:block;color:#cfb8a4;margin-top:2px}.buy{border:0;border-radius:9px;background:#8b6038;padding:8px;font-weight:900}.buy:disabled{opacity:.35}.summary{display:grid;grid-template-columns:1fr auto;gap:6px;background:#231915;border-radius:10px;padding:9px;margin-bottom:9px;font-size:13px}.summary div:nth-child(even){font-weight:900}
@media(max-width:560px){#app{padding:6px 6px 74px}.header{grid-template-columns:1fr auto}.header .stat:nth-of-type(3){display:none}.brand{font-size:16px}.stationRow{grid-template-columns:.72fr 1.55fr .85fr;gap:4px}.station{padding:5px}.grill{padding:5px;border-width:4px}.molds{gap:3px}.moldLabel{font-size:7px}.case{height:110px}.doughBowl{height:75px}.bowl{width:78px;height:45px}.doughBtn,.shapeBtn{font-size:9px;padding:7px 4px}.fill{font-size:8px;padding:4px}.customer{min-width:190px}.actionRow{grid-template-columns:1fr 1fr}.actionRow .manageInline{display:none}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div><div class="brand">🐟 붕어빵 장사왕</div><div class="mini" id="weatherText">🥶 추움</div></div>
    <div class="stat">📅 <span id="day">1</span>일</div>
    <div class="stat">💰 <span id="cash">5,000</span></div>
  </div>

  <div class="stall">
    <div class="awning"></div>
    <div class="customerStrip">
      <div class="customerTitle">👥 주문 — 여기만 보고 바로 구워 판매하세요</div>
      <div id="customers" class="customers"></div>
    </div>

    <div class="workbench">
      <div class="benchTitle">반죽 → 붕어빵틀 → 진열장, 전부 한 작업대</div>
      <div class="stationRow">
        <section class="station">
          <h3>🥣 반죽</h3>
          <div class="doughBowl"><div class="bowl"></div></div>
          <div id="doughStatus" class="doughStatus">반죽 없음</div>
          <div class="progress"><div id="doughProgress"></div></div>
          <button id="doughBtn" class="doughBtn">반죽 만들기</button>
          <div id="ingredientButtons" class="fillings"></div>
        </section>

        <section class="station">
          <h3>🔥 붕어빵틀 <span id="moldCountLabel">4구</span></h3>
          <div class="grill"><div id="molds" class="molds"></div></div>
        </section>

        <section class="station">
          <h3>🪟 판매대</h3>
          <div class="case"><div class="steam"><i></i><i></i><i></i></div><div id="caseShelf" class="shelf"></div></div>
          <div id="caseCount" class="caseCount">0 / 8</div>
          <button id="shapeBtn" class="shapeBtn">모양잡기 → 전부 진열</button>
        </section>
      </div>

      <div class="actionRow">
        <button id="openBtn" class="openBtn">영업 시작</button>
        <button id="endBtn" class="endBtn">장사 마감</button>
        <button id="manageInline" class="manageBtn manageInline">가게 관리</button>
      </div>
    </div>
  </div>
</div>

<div class="bottomBar"><button id="manageBtn" class="manageBtn">🔧 가게 관리</button><button id="quickStatus" class="manageBtn">📊 오늘 장사</button></div>

<div id="mixModal" class="modal"><div class="modalCard"><h2>🥣 반죽 만들기</h2><div class="mixScene"><div class="bigBowl"><div id="whisk" class="whisk"></div></div><div id="mixDots" class="dots"><span></span><span></span><span></span><span></span><span></span></div><button id="mixBtn" class="doughBtn full">거품기로 섞기</button><button id="closeMixBtn" class="manageBtn full" style="margin-top:7px">닫기</button></div></div></div>
<div id="manageModal" class="modal"><div class="modalCard"><h2>🔧 가게 관리</h2><div id="manageGrid" class="manageGrid"></div><button id="closeManage" class="manageBtn full" style="margin-top:8px">닫기</button></div></div>
<div id="summaryModal" class="modal"><div class="modalCard"><h2>📊 오늘 장사</h2><div id="summaryBox" class="summary"></div><button id="closeSummary" class="manageBtn full">닫기</button></div></div>
<div id="closeModal" class="modal"><div class="modalCard"><h2>🌙 영업 종료</h2><div id="daySummary" class="summary"></div><button id="nextDayBtn" class="doughBtn full">다음 날</button></div></div>

<script>
const fmt=n=>Math.max(0,Math.floor(n)).toLocaleString('ko-KR');
const fillings={redbean:{name:'팥',icon:'🫘',price:700,unlock:0},custard:{name:'슈크림',icon:'🍮',price:900,unlock:6000},cheese:{name:'치즈',icon:'🧀',price:1100,unlock:10000},pizza:{name:'피자',icon:'🍕',price:1400,unlock:16000}};
const moldLevels=[4,6,8,10,12,16],moldCosts=[8000,15000,25000,40000,65000];
const caseLevels=[8,12,18,26,36],caseCosts=[5000,9000,15000,24000];
const fermentTimes=[8,6,4.5,3.5],fermentCosts=[7000,14000,25000];
const doughCaps=[12,18,24,32,40],doughCosts=[6000,12000,21000,35000];
const defaultState=()=>({day:1,cash:5000,moldLevel:0,caseLevel:0,fermentLevel:0,doughLevel:0,unlocked:['redbean'],selected:'redbean',doughStage:'idle',mix:0,dough:0,fermentStart:0,molds:[],queue:[],display:[],open:false,customers:[],lastCustomer:0,sold:0,revenue:0,perfect:0,burnt:0,missed:0,weather:'추움',weatherBoost:1});
let S;try{S=JSON.parse(localStorage.getItem('bkSimpleV1'))||defaultState()}catch(e){S=defaultState()}S.open=false;S.customers=[];if(!Array.isArray(S.molds)||S.molds.length!==moldLevels[S.moldLevel])resetMolds();if(typeof S.doughLevel!=='number')S.doughLevel=0;
function resetMolds(){S.molds=Array.from({length:moldLevels[S?.moldLevel||0]},()=>({stage:'empty',fill:null,t:0,q:'normal'}))}
function save(){localStorage.setItem('bkSimpleV1',JSON.stringify(S))}
function beep(type='ding'){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=type==='bad'?140:type==='coin'?900:540;g.gain.setValueAtTime(.04,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.start();o.stop(a.currentTime+.13);setTimeout(()=>a.close(),220)}catch(e){}}
function metalFlip(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),t=a.currentTime;const makeHit=(delay,freq,gain,dur)=>{const n=a.createBufferSource(),b=a.createBuffer(1,Math.floor(a.sampleRate*dur),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,5);n.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=3.2;const g=a.createGain();g.gain.setValueAtTime(gain,t+delay);g.gain.exponentialRampToValueAtTime(.001,t+delay+dur);n.connect(f);f.connect(g);g.connect(a.destination);n.start(t+delay);n.stop(t+delay+dur)};makeHit(0,2100,.15,.055);makeHit(.075,1250,.11,.075);const low=a.createOscillator(),lg=a.createGain();low.type='sine';low.frequency.value=115;lg.gain.setValueAtTime(.055,t);lg.gain.exponentialRampToValueAtTime(.001,t+.09);low.connect(lg);lg.connect(a.destination);low.start(t);low.stop(t+.1);setTimeout(()=>a.close(),350)}catch(e){}}
function randomWeather(){const arr=[['추움',1,'🥶'],['매우 추움',1.25,'❄️'],['눈',1.45,'🌨️'],['포근함',.82,'🌤️']];const w=arr[Math.floor(Math.random()*arr.length)];S.weather=w[0];S.weatherBoost=w[1];S.weatherIcon=w[2]}if(!S.weatherIcon)randomWeather();
function render(){document.getElementById('day').textContent=S.day;document.getElementById('cash').textContent=fmt(S.cash);document.getElementById('weatherText').textContent=`${S.weatherIcon} ${S.weather}`;document.getElementById('moldCountLabel').textContent=`${moldLevels[S.moldLevel]}구`;document.getElementById('caseCount').textContent=`${S.display.length} / ${caseLevels[S.caseLevel]}`;renderDough();renderFillings();renderMolds();renderCase();renderCustomers();document.getElementById('openBtn').disabled=S.open;document.getElementById('endBtn').disabled=!S.open;document.getElementById('shapeBtn').disabled=!S.queue.length||S.display.length>=caseLevels[S.caseLevel];save()}
function renderDough(){const st=document.getElementById('doughStatus'),btn=document.getElementById('doughBtn'),bar=document.getElementById('doughProgress');if(S.doughStage==='idle'){st.textContent='반죽 없음';btn.textContent='반죽 만들기 · 500원';btn.disabled=S.cash<500;bar.style.width='0%'}else if(S.doughStage==='mixing'){st.textContent=`섞는 중 ${S.mix}/5`;btn.textContent='반죽 팝업';btn.disabled=false;bar.style.width=(S.mix*20)+'%'}else if(S.doughStage==='ferment'){const total=fermentTimes[S.fermentLevel],left=Math.max(0,total-(Date.now()-S.fermentStart)/1000);st.textContent=`숙성 ${left.toFixed(1)}초`;btn.textContent='숙성 중';btn.disabled=true;bar.style.width=((1-left/total)*100)+'%'}else{st.textContent=`사용 가능 ${S.dough}개`;btn.textContent='반죽 준비 완료';btn.disabled=true;bar.style.width='100%'}}
function openMix(){document.getElementById('mixModal').classList.add('show');updateDots()}function updateDots(){[...document.querySelectorAll('#mixDots span')].forEach((x,i)=>x.classList.toggle('on',i<S.mix))}
document.getElementById('doughBtn').onclick=()=>{if(S.doughStage==='idle'){if(S.cash<500)return;S.cash-=500;S.doughStage='mixing';S.mix=0;openMix()}else if(S.doughStage==='mixing')openMix();render()};document.getElementById('mixBtn').onclick=()=>{if(S.doughStage!=='mixing')return;S.mix++;beep();updateDots();if(S.mix>=5){S.doughStage='ferment';S.fermentStart=Date.now();document.getElementById('mixModal').classList.remove('show')}render()};document.getElementById('closeMixBtn').onclick=()=>document.getElementById('mixModal').classList.remove('show');
function renderFillings(){const box=document.getElementById('ingredientButtons');box.innerHTML='';Object.entries(fillings).forEach(([k,v])=>{const b=document.createElement('button');b.className='fill'+(S.selected===k?' active':'');b.textContent=v.icon+(S.unlocked.includes(k)?'':'🔒');b.disabled=!S.unlocked.includes(k);b.onclick=()=>{S.selected=k;render()};box.appendChild(b)})}
function renderMolds(){const box=document.getElementById('molds');box.innerHTML='';S.molds.forEach((m,i)=>{let label='빈 틀';if(m.stage==='batter')label='고명';if(m.stage==='cook1')label='굽는 중';if(m.stage==='flipReady')label='뒤집기!';if(m.stage==='cook2')label='굽는 중';if(m.stage==='outReady')label='꺼내기!';if(m.stage==='burnt')label='탐';const el=document.createElement('button');el.className='mold '+m.stage;el.innerHTML=`<div class="fish"></div><div class="moldLabel">${label}</div>`;el.onclick=()=>clickMold(i);box.appendChild(el)})}
function clickMold(i){const m=S.molds[i],now=Date.now();if(m.stage==='empty'){if(S.dough<=0){beep('bad');return}S.dough--;m.stage='batter';if(S.dough===0)S.doughStage='idle'}else if(m.stage==='batter'){m.fill=S.selected;m.stage='cook1';m.t=now;m.q='normal'}else if(m.stage==='flipReady'){m.q=now-m.t<1700?'perfect':'normal';m.stage='cook2';m.t=now;metalFlip()}else if(m.stage==='outReady'){if(now-m.t<1700&&m.q==='perfect')S.perfect++;S.queue.push({fill:m.fill,q:m.q});S.molds[i]={stage:'empty',fill:null,t:0,q:'normal'};beep()}else if(m.stage==='burnt'){S.burnt++;S.molds[i]={stage:'empty',fill:null,t:0,q:'normal'};beep('bad')}render()}
function renderCase(){const box=document.getElementById('caseShelf');box.innerHTML='';S.display.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<span>${fillings[x.fill].icon}${x.q==='perfect'?'★':''}</span>`;box.appendChild(d)})}
document.getElementById('shapeBtn').onclick=()=>{while(S.queue.length&&S.display.length<caseLevels[S.caseLevel])S.display.push(S.queue.shift());beep();render()};
const avatars=['🧑🏻','👩🏻','👨🏻','👵🏻','👴🏻','🧒🏻'];function spawn(){if(!S.open||S.customers.length>=3)return;const f=S.unlocked[Math.floor(Math.random()*S.unlocked.length)],qty=1+Math.floor(Math.random()*Math.min(3,1+Math.floor(S.day/2)));S.customers.push({id:Date.now()+Math.random(),avatar:avatars[Math.floor(Math.random()*avatars.length)],fill:f,qty,born:Date.now(),wait:20000})}
function renderCustomers(){const box=document.getElementById('customers');box.innerHTML='';if(!S.customers.length){box.innerHTML='<div style="font-size:12px;color:#725038;padding:8px">'+(S.open?'손님을 기다리는 중…':'영업 시작을 눌러주세요')+'</div>';return}S.customers.forEach(c=>{const remain=Math.max(0,1-(Date.now()-c.born)/c.wait),d=document.createElement('div');d.className='customer';d.innerHTML=`<div class="avatar">${c.avatar}</div><div><div class="order">${fillings[c.fill].icon} ${fillings[c.fill].name} ${c.qty}개</div><div class="patience"><div style="width:${remain*100}%"></div></div></div><button class="sell">판매</button>`;d.querySelector('.sell').onclick=()=>sell(c.id);box.appendChild(d)})}
function sell(id){const c=S.customers.find(x=>x.id===id);if(!c)return;const idx=[];S.display.forEach((x,i)=>{if(x.fill===c.fill&&idx.length<c.qty)idx.push(i)});if(idx.length<c.qty){beep('bad');return}let money=0;idx.reverse().forEach(i=>{const x=S.display[i];money+=fillings[x.fill].price*(x.q==='perfect'?1.25:1);S.display.splice(i,1)});money=Math.round(money/100)*100;S.cash+=money;S.sold+=c.qty;S.revenue+=money;S.customers=S.customers.filter(x=>x.id!==id);beep('coin');render()}
document.getElementById('openBtn').onclick=()=>{S.open=true;S.lastCustomer=0;render()};document.getElementById('endBtn').onclick=()=>{if(!S.open)return;S.open=false;S.customers=[];showClose()};
function summaryHtml(){return `<div>판매량</div><div>${S.sold}개</div><div>매출</div><div>${fmt(S.revenue)}원</div><div>Perfect</div><div>${S.perfect}개</div><div>탄 붕어빵</div><div>${S.burnt}개</div><div>놓친 손님</div><div>${S.missed}명</div>`}
function showClose(){document.getElementById('daySummary').innerHTML=summaryHtml();document.getElementById('closeModal').classList.add('show')};document.getElementById('nextDayBtn').onclick=()=>{S.day++;S.sold=S.revenue=S.perfect=S.burnt=S.missed=0;randomWeather();document.getElementById('closeModal').classList.remove('show');render()};
function renderManage(){const box=document.getElementById('manageGrid');box.innerHTML='';const add=(title,desc,price,disabled,fn)=>{const r=document.createElement('div');r.className='upgrade';r.innerHTML=`<div><b>${title}</b><small>${desc}</small></div><button class="buy">${price}</button>`;const b=r.querySelector('button');b.disabled=disabled;b.onclick=fn;box.appendChild(r)};const ml=S.moldLevel;add('붕어빵틀 확장',ml<moldLevels.length-1?`${moldLevels[ml]}구 → ${moldLevels[ml+1]}구`:'최대',ml<moldCosts.length?fmt(moldCosts[ml])+'원':'MAX',ml>=moldCosts.length||S.cash<moldCosts[ml]||S.molds.some(m=>m.stage!=='empty'),()=>{S.cash-=moldCosts[ml];S.moldLevel++;resetMolds();renderManage();render()});const cl=S.caseLevel;add('진열장 확장',cl<caseLevels.length-1?`${caseLevels[cl]} → ${caseLevels[cl+1]}개`:'최대',cl<caseCosts.length?fmt(caseCosts[cl])+'원':'MAX',cl>=caseCosts.length||S.cash<caseCosts[cl],()=>{S.cash-=caseCosts[cl];S.caseLevel++;renderManage();render()});const fl=S.fermentLevel;add('숙성통 개선',fl<fermentTimes.length-1?`${fermentTimes[fl]}초 → ${fermentTimes[fl+1]}초`:'최대',fl<fermentCosts.length?fmt(fermentCosts[fl])+'원':'MAX',fl>=fermentCosts.length||S.cash<fermentCosts[fl],()=>{S.cash-=fermentCosts[fl];S.fermentLevel++;renderManage();render()});const dl=S.doughLevel;add('반죽량 늘리기',dl<doughCaps.length-1?`${doughCaps[dl]} → ${doughCaps[dl+1]}개`:'최대',dl<doughCosts.length?fmt(doughCosts[dl])+'원':'MAX',dl>=doughCosts.length||S.cash<doughCosts[dl],()=>{S.cash-=doughCosts[dl];S.doughLevel++;renderManage();render()});Object.entries(fillings).filter(([,v])=>v.unlock).forEach(([k,v])=>add(`${v.icon} ${v.name} 해금`,`판매가 ${fmt(v.price)}원`,S.unlocked.includes(k)?'해금됨':fmt(v.unlock)+'원',S.unlocked.includes(k)||S.cash<v.unlock,()=>{S.cash-=v.unlock;S.unlocked.push(k);renderManage();render()}))}
function openManage(){renderManage();document.getElementById('manageModal').classList.add('show')}document.getElementById('manageBtn').onclick=openManage;document.getElementById('manageInline').onclick=openManage;document.getElementById('closeManage').onclick=()=>document.getElementById('manageModal').classList.remove('show');document.getElementById('quickStatus').onclick=()=>{document.getElementById('summaryBox').innerHTML=summaryHtml();document.getElementById('summaryModal').classList.add('show')};document.getElementById('closeSummary').onclick=()=>document.getElementById('summaryModal').classList.remove('show');
setInterval(()=>{const now=Date.now();if(S.doughStage==='ferment'&&now-S.fermentStart>=fermentTimes[S.fermentLevel]*1000){S.doughStage='ready';S.dough=doughCaps[S.doughLevel];beep()}S.molds.forEach(m=>{if(m.stage==='cook1'&&now-m.t>=3600){m.stage='flipReady';m.t=now;beep()}else if(m.stage==='flipReady'&&now-m.t>=5600){m.stage='burnt';beep('bad')}else if(m.stage==='cook2'&&now-m.t>=2900){m.stage='outReady';m.t=now;beep()}else if(m.stage==='outReady'&&now-m.t>=5600){m.stage='burnt';beep('bad')}});if(S.open){const interval=Math.max(3400,6800/S.weatherBoost-(S.day-1)*100);if(!S.lastCustomer||now-S.lastCustomer>interval){spawn();S.lastCustomer=now}const before=S.customers.length;S.customers=S.customers.filter(c=>now-c.born<c.wait);if(S.customers.length<before)S.missed+=before-S.customers.length}render()},300);render();

try { if (window.AndroidBridge && AndroidBridge.ready) AndroidBridge.ready(); } catch(e) {}
</script>
</body></html>
