name: Build Verify Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: bungeoppang-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-install-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and embedded game
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.bungeoppang.king.sept30e'"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q "붕어빵 장사왕"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q 'id="app"'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install launch render and capture on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.bungeoppang.king.sept30e/com.bungeoppang.king.MainActivity
            sleep 7
            adb shell pidof com.bungeoppang.king.sept30e
            adb shell dumpsys activity activities | grep -q "com.bungeoppang.king.sept30e/com.bungeoppang.king.MainActivity"
            adb exec-out screencap -p > app-screen.png
            test -s app-screen.png

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BungeoppangKing-v1.5-fixed-screen.apk

      - name: Upload APK and screen proof
        uses: actions/upload-artifact@v4
        with:
          name: BungeoppangKing-v1.5-proof
          path: |
            BungeoppangKing-v1.5-fixed-screen.apk
            app-screen.png
          if-no-files-found: error

      - name: Publish GitHub Release
        run: |
          gh release delete v1.5.0 --cleanup-tag -y || true
          gh release create v1.5.0 BungeoppangKing-v1.5-fixed-screen.apk --target "${GITHUB_SHA}" --title "붕어빵 장사왕 v1.5.0 화면복구" --notes "잘못 업로드된 index.html을 실제 게임 HTML로 복구. 게임 JS가 렌더 완료를 알릴 때까지 네이티브 로딩화면을 유지. Android 15 에뮬레이터 설치/실행 후 실제 화면 캡처까지 생성한 APK."
