name: Build Verify Oneuldo Meat APK

on:
  workflow_dispatch:
  push:
    branches: [ oneuldo-meat ]

concurrency:
  group: oneuldo-meat-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-install-test:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK package and signature
        run: |
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.taehee.oneuldogogi'"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.taehee.oneuldogogi/com.bungeoppang.king.MainActivity
            sleep 5
            adb shell pidof com.taehee.oneuldogogi
            adb exec-out screencap -p > app-screen.png
            test -s app-screen.png

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OneuldoMeat-v1.0-github.apk

      - name: Upload verified APK and screenshot
        uses: actions/upload-artifact@v4
        with:
          name: OneuldoMeat-v1.0-verified
          path: |
            OneuldoMeat-v1.0-github.apk
            app-screen.png
