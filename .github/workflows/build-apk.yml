name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BungeoppangKing-v1.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BungeoppangKing-debug-apk
          path: BungeoppangKing-v1.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        run: |
          gh release delete v1.0.0 --cleanup-tag -y || true
          gh release create v1.0.0 BungeoppangKing-v1.apk --target "${GITHUB_SHA}" --title "붕어빵 장사왕 v1.0.0" --notes "정식 Android Gradle 빌드 APK"
